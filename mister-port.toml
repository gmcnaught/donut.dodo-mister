# Donut Dodo device files, rendered by mister-hybrid-platform:
#   python3 external/mister-hybrid-platform/tools/mister_platform.py render mister-port.toml --out <sd-root>
# (scripts/make_release.sh does this). Generated: games/DonutDodo/launch.sh +
# platform/ (incl. platform/MiSTer_hybrid with --hook-binary, and
# platform/hybrid.d/DonutDodo.conf), Scripts/DonutDodo{,_CoresMenu}.sh, _Other/DonutDodo.mgl.
[port]
name     = "DonutDodo"
title    = "Donut Dodo"
profile  = "gm-fabric"
engine   = "godot3-frt"

[launch]
# Kept as frt_3.5.2: the other fabric ports' launchers reap this name.
process       = "frt_3.5.2"
command       = ["./frt_3.5.2", "--main-pack", "gamedata/DonutDodo.pck", "--video-driver", "GLES2"]
ready_pattern = "fabric bring-up"
# The engine does not pin its main thread to CPU0, so it keeps both CPUs and the
# launcher moves nothing (the pre-platform launcher had no CPU placement).
cpu_isolate   = false
engine_cpus   = 3
# Fabric wedge mid-game -> reload the core (PLAN.md §1j: C_DONE frozen behind
# C_SUBMIT ~2 min into play after a clean start). Override: MH_STALL_S in
# /tmp/donutdodo_test.env.
stall_timeout = 6

[launch.env]
# GL is a null implementation inside our libSDL2 (patch 0007): no Mesa is loaded.
# A/B only: /tmp/donutdodo_test.env with MESA_DIR=<llvmpipe runtime> and
# SDL_MISTER_NULL_GL=0, SDL_VIDEO_EGL_DEFAULT_DISPLAY=1, EGL_PLATFORM=surfaceless,
# LIBGL_DRIVERS_PATH=$MESA_DIR, GALLIUM_DRIVER=llvmpipe exported (PLAN.md §1l).
LD_LIBRARY_PATH     = "$MH_GAMEDIR/libs${MESA_DIR:+:$MESA_DIR}"
SDL_VIDEODRIVER     = "offscreen"        # no DRM/KMS device on MiSTer
# Scanout geometry is the core's wire contract: must match the RBF's FB_W/FB_H
# and the host's BLT_FB_WIDTH/HEIGHT.
SDL_MISTER_SCANOUT  = "320x240"
# Safe area (src/misterglue/safe_area.h): with OSD Vertical Lines = 240 (the
# core's default) the whole frame is scanned out and "fit" is 1:1; with 224 the
# core scans rows 7-230, so the final picture is scaled into that window instead
# of losing its top and bottom. "fit" works in display units: MISTER_GLUE_DAR is
# the aspect the core shows either window at (the RBF's video_freak ARX:ARY), so
# at 224 the 4:3 game fills the 4:3 window whole (320x224). MISTER_GLUE_OSD_LINES=1
# reads the OSD choice back from the core (C_STATUS bit2) every frame;
# MISTER_GLUE_VISIBLE must match the RBF's short window (`DISP_H/`DISP_Y0). A
# user's games/DonutDodo/display.cfg (safe_area=...) overrides
# MISTER_GLUE_SAFE_AREA; it is not shipped, so a release never overwrites it.
MISTER_GLUE_VISIBLE        = "320x224+0+7"
MISTER_GLUE_DAR            = "4:3"
MISTER_GLUE_OSD_LINES      = "1"
MISTER_GLUE_SAFE_AREA      = "fit"
MISTER_GLUE_SAFE_AREA_FILE = "$MH_GAMEDIR/display.cfg"
# CRT layout (src/godot/mister_layout.gd, port-owned): the engine registers it as
# an extra autoload (patches/0008). OSD HUD Down / Picture Up (C_STATUS bits 7:3,
# read by the glue each frame) move the HUD down / the picture up; at +0,
# display.cfg hud_offset=N / v_shift=N apply. All default to 0.
MISTER_GODOT_AUTOLOAD      = "MisterLayout=$MH_GAMEDIR/port/mister_layout.gd"
SDL_MISTER_DDR      = "0"                # the fabric publishes frames, not our readback
# The FPGA drains a DDR audio ring; gm_audio SRC_RATE must equal the driver's 48 kHz.
SDL_AUDIODRIVER     = "mister"
# The core's published joystick words, so the OSD button mapping is what the game sees.
SDL_MISTER_JOY          = "1"
SDL_MISTER_JOY_PLAYERS  = "1"
SDL_MISTER_JOY_BASE     = "$MISTER_GM_FABRIC_FB_BASE"   # 0x3BF40000 (Maldita.sv FB_QW_BASE)
SDL_MISTER_GLUE     = "1"
MISTER_GLUE_FABRIC  = "1"
GMLOADER_RASTER     = "mfgpu"            # the fabric back-end over the CPU one
GODOT_SILENCE_ROOT_WARNING = "1"
XDG_CONFIG_HOME     = "$MH_GAMEDIR/conf"
XDG_DATA_HOME       = "$MH_GAMEDIR/conf"

[scripts]
required_files = [ ["gamedata/DonutDodo.pck", "copy it from your itch.io download (see README.md)"] ]
legacy_main    = ["/media/fat/games/DonutDodo/MiSTer_DonutDodo"]
extra          = "dist/scripts-extra.sh"
